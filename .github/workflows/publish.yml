name: Publish

# Runs after "Merge to main" succeeds. Publishing lives in its own workflow
# because the npm trusted-publisher entries on npmjs.org are bound to this
# filename (publish.yml) and the `production` environment, so both have to
# stay in step with them.
on:
  workflow_run:
    workflows: [Merge to main]
    types: [completed]
    branches: [main]

jobs:
  # Publishes any package whose version is ahead of npm. Runs only once the
  # version PR has been merged and no changesets are left.
  publish:
    name: Publish to npm
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest-large
    environment: production
    permissions:
      contents: write # pushes the release tags
      id-token: write # required for npm OIDC trusted publishing

    steps:
      # workflow_run checks out the default branch by default; pin to the
      # commit that "Merge to main" tested so a later push cannot slip in.
      - name: Checkout Repo
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      # Pending changesets mean the release job opened a version PR instead,
      # so there is nothing to publish yet.
      - name: Check for changesets
        id: changesets
        run: |
          if [ -n "$(find .changeset -name '*.md' -not -name 'README.md')" ]; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi
      # No registry-url here on purpose. It would write an .npmrc containing an
      # _authToken line, and npm would then try that credential instead of
      # exchanging its OIDC token. Publishing goes to registry.npmjs.org, which
      # is npm's default, and curated Artifactory is for resolving dependencies
      # rather than a publish target.
      - name: Setup Node.js 24
        if: steps.changesets.outputs.has_changesets == 'false'
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: 24
      # OIDC trusted publishing needs npm 11.5.1 or newer. Node 24 does not
      # bundle a new enough npm in every release, so the minimum is installed
      # explicitly rather than assumed.
      - name: Ensure npm supports trusted publishing
        if: steps.changesets.outputs.has_changesets == 'false'
        run: |
          npm i -g npm@11
          npm --version
      - name: Install Dependencies
        if: steps.changesets.outputs.has_changesets == 'false'
        run: npm install
      - name: Setup CI Git User
        if: steps.changesets.outputs.has_changesets == 'false'
        run: |
          git config user.name twilio-labs-ci
          git config user.email 65686990+twilio-labs-ci@users.noreply.github.com
      - name: Create new build
        if: steps.changesets.outputs.has_changesets == 'false'
        run: |
          npm run clean
          npm run build
      - name: Publish to npm
        if: steps.changesets.outputs.has_changesets == 'false'
        run: |
          npm run npm:publish
          # changeset publish creates a git tag per published package; push
          # them so releases stay traceable from the repo. changesets/action
          # used to do this before it was replaced in #559.
          git push origin --tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
